<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lyraxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FFF000"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0b0e14"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#20293a" stroke-width="6"/>
  <!-- Glowing waveform bars -->
  <rect x="80" y="240" width="16" height="80" rx="8" fill="#00E5FF" opacity="0.8"/>
  <rect x="110" y="200" width="16" height="120" rx="8" fill="#00E5FF" opacity="0.9"/>
  <rect x="140" y="160" width="16" height="160" rx="8" fill="#FFF000"/>
  <!-- Central Stylized Lightning Note -->
  <path d="M260 90 L380 90 L380 280 A 50 50 0 1 1 330 230 L330 160 L230 240 L270 240 L220 370 L310 240 L260 240 Z" 
        fill="url(#lyraxGrad)" filter="url(#glow)"/>
  <!-- Sound ring waves -->
  <path d="M400 180 A 100 100 0 0 1 400 320" fill="none" stroke="#FFF000" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M430 150 A 140 140 0 0 1 430 350" fill="none" stroke="#00E5FF" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <!-- LyraX Brand Label -->
  <text x="256" y="445" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="6" text-anchor="middle" fill="#ffffff">LYRA<tspan fill="#FFF000">X</tspan></text>
</svg>
